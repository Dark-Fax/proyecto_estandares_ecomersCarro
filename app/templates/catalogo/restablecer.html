{% extends "auth_base.html" %}{% block title %}Nueva contraseña{% endblock %}
{% block c %}<span class="eyebrow">Acceso</span><h1>Nueva contraseña</h1><p class="lede">Elige una contraseña segura para tu cuenta.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label for="password">Nueva contraseña</label><input id="password" type="password" name="password" autocomplete="new-password" required><p class="hint">Mínimo 8 caracteres, una mayúscula y un número.</p></div>
<button class="btn btn-block" style="margin-top:24px">Guardar contraseña</button></form>{% endblock %}
