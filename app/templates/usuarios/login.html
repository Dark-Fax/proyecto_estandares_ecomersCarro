{% extends "auth_base.html" %}{% block title %}Iniciar sesión{% endblock %}
{% block c %}<span class="eyebrow">Bienvenido</span><h1>Iniciar sesión</h1><p class="lede">Accede para solicitar tu vehículo y consultar tus compras.</p>
<form method="post" action="{{ url_for('usuarios.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label for="usuario">Usuario</label><input id="usuario" type="text" name="usuario" placeholder="Tu nombre de usuario" autocomplete="username" required autofocus></div>
<div class="field"><label for="password">Contraseña</label><input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required></div>
<button class="btn btn-block" style="margin-top:24px">Iniciar sesión</button></form>
<div class="auth-links"><a href="{{ url_for('catalogo.recuperar') }}">¿Olvidaste tu contraseña?</a><span>¿No tienes cuenta? <a href="{{ url_for('usuarios.registro') }}">Regístrate</a></span><a href="{{ url_for('catalogo.listado') }}">Ver el catálogo sin ingresar</a></div>{% endblock %}
