{% extends "auth_base.html" %}{% block title %}Crear cuenta{% endblock %}
{% block c %}<span class="eyebrow">Únete</span><h1>Crear cuenta</h1><p class="lede">Regístrate para solicitar vehículos y seguir tus compras.</p>
<form method="post" action="{{ url_for('usuarios.registro') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label for="usuario">Usuario</label><input id="usuario" type="text" name="usuario" placeholder="Nombre de usuario" autocomplete="username" required autofocus></div>
<div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required></div>
<div class="field"><label for="password">Contraseña</label><input id="password" type="password" name="password" placeholder="••••••••" autocomplete="new-password" required></div>
<div class="field"><label for="telefono">Teléfono</label><input id="telefono" type="tel" name="telefono" placeholder="3001234567" pattern="[0-9]{10}" inputmode="numeric" maxlength="10" required><p class="hint">10 dígitos, sin espacios.</p></div>
<button class="btn btn-block" style="margin-top:24px">Registrarme</button></form>
<div class="auth-links"><span>¿Ya tienes cuenta? <a href="{{ url_for('usuarios.login') }}">Inicia sesión</a></span></div>{% endblock %}
